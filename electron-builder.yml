appId: edu.wetlsp.explorer
productName: WetLSP Explorer
copyright: WetLSP Explorer contributors
directories:
  output: release
files:
  - dist/**/*
  - desktop/main.mjs
  - desktop/server.mjs
  - desktop/smoke.mjs
  - package.json
  - '!node_modules/**/*'
# Sample sites loaded on first launch (`npm run samples` builds the folder).
# Kept outside the asar so the local server streams them straight from disk.
extraResources:
  - from: samples
    to: samples
    filter: ['**/*']
asar: true
npmRebuild: false
# Restores a valid ad-hoc signature that electron-builder's repacking invalidates.
# Without it, Apple Silicon reports the app as "damaged" and refuses to open it.
afterPack: scripts/adhoc-sign.mjs
artifactName: WetLSP-Explorer-${version}-${os}-${arch}.${ext}
mac:
  category: public.app-category.education
  icon: public/icons/icon-512.png
  target: dmg
  # No Developer ID certificate: electron-builder skips its own signing and
  # scripts/adhoc-sign.mjs signs with the ad-hoc identity instead.
  identity: null
  notarize: false
dmg:
  title: WetLSP Explorer
  contents:
    - x: 130
      y: 180
      type: file
    - x: 410
      y: 180
      type: link
      path: /Applications
win:
  icon: public/icons/icon-512.png
  target: nsis
nsis:
  oneClick: true
  perMachine: false
  allowElevation: false
  createDesktopShortcut: true
  createStartMenuShortcut: true
  deleteAppDataOnUninstall: false
publish: null
